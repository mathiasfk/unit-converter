<body>
    <div class="container">
        <div class="top-bar">
            <div class="language-selector">
                <select onchange="location.href=this.value" aria-label="Select language">
                    <option value="../index.html">🇧🇷 Português</option>
                    <option value="index.html" selected>🇺🇸 English</option>
                    <option value="../es/index.html">🇪🇸 Español</option>
                    <option value="../fr/index.html">🇫🇷 Français</option>
                    <option value="../de/index.html">🇩🇪 Deutsch</option>
                </select>
            </div>
            <div class="theme-toggle">
                <span class="theme-label" id="theme-label">Theme</span>
                <div class="theme-options" role="group" aria-labelledby="theme-label">
                    <button type="button" class="theme-option" data-theme="system" aria-pressed="true">System</button>
                    <button type="button" class="theme-option" data-theme="light" aria-pressed="false">Light</button>
                    <button type="button" class="theme-option" data-theme="dark" aria-pressed="false">Dark</button>
                </div>
            </div>
        </div>
        <main>
            <div class="converter-section">
                <!-- Dimension Selection -->
                <div class="dimension-selector">
                    <h3>Select measurement type</h3>
                    <div class="dimension-buttons">
                        <button class="dimension-btn active" data-dimension="length" aria-label="Select length">
                            📏 Length
                        </button>
                        <button class="dimension-btn" data-dimension="weight" aria-label="Select weight">
                            ⚖️ Weight
                        </button>
                        <button class="dimension-btn" data-dimension="height" aria-label="Select height">
                            📏 Height
                        </button>
                    </div>
                    <select class="dimension-select" aria-label="Selected measurement type">
                        <option value="length">Length</option>
                        <option value="weight">Weight</option>
                        <option value="height">Height</option>
                    </select>
                </div>

                <!-- Conversion Area -->
                <div class="conversion-area">
                    <div class="conversion-row">
                        <div class="unit-group">
                            <label for="from-unit">From:</label>
                            <select id="from-unit" aria-label="Source unit"></select>
                        </div>
                        
                        <div class="input-group">
                            <label for="value-input">Value:</label>
                            <input type="number" id="value-input" placeholder="Enter a value" step="any" oninput="trackInputEvent(this.value)" aria-label="Value to convert" inputmode="decimal">
                        </div>
                    </div>

                    <button class="conversion-arrow" id="swap-units-btn" title="Swap units" aria-label="Swap conversion units">
                        ⇅
                    </button>

                    <div class="conversion-row">
                        <div class="unit-group">
                            <label for="to-unit">To:</label>
                            <select id="to-unit" aria-label="Target unit"></select>
                        </div>
                        
                        <div class="result-group">
                            <label for="result-display">Result:</label>
                            <input type="text" id="result-display" readonly placeholder="Result will appear here" aria-label="Conversion result">
                        </div>
                    </div>
                </div>

                <!-- Info Area -->
                <div id="info-display" class="info-display" aria-live="polite">
                    <p>Select a dimension and units to start converting!</p>
                </div>
            </div>

            <!-- Examples -->
            <section class="examples-section">
                <h2>💡 Fun examples to try</h2>
                <div id="examples-list" class="examples-list">
                    <!-- Examples will be inserted dynamically -->
                </div>
            </section>
        </main>

        <footer>
            <p>Made with ❤️ by <a href="https://github.com/mathiasfk" target="_blank" rel="noopener">mathiasfk</a> to make measurements more fun and educational!</p>
            <p><small>Version 2.1.0 • © 2026 Mathias FK • <a href="https://github.com/mathiasfk/unit-converter" target="_blank" rel="noopener">Open source on GitHub</a></small></p>
        </footer>
    </div>

    <!-- Templates for dynamic rendering -->
    <template id="conversion-info-template">
        <div class="conversion-info">
            <p><strong class="conversion-from"></strong> equals <strong class="conversion-to"></strong></p>
            <div class="unit-details">
                <div class="unit-detail">
                    <span class="unit-emoji conversion-from-emoji" aria-hidden="true"></span>
                    <span class="unit-description conversion-from-description"></span>
                </div>
                <div class="unit-detail">
                    <span class="unit-emoji conversion-to-emoji" aria-hidden="true"></span>
                    <span class="unit-description conversion-to-description"></span>
                </div>
            </div>
            <div class="fun-facts-container"></div>
        </div>
    </template>
    <template id="units-info-template">
        <div class="units-info">
            <h4>Unit Information</h4>
            <div class="unit-info-grid">
                <div class="unit-info-item">
                    <span class="unit-emoji units-from-emoji" aria-hidden="true"></span>
                    <div>
                        <strong class="units-from-name"></strong>
                        <p class="units-from-description"></p>
                    </div>
                </div>
                <div class="conversion-divider" aria-hidden="true"></div>
                <div class="unit-info-item">
                    <span class="unit-emoji units-to-emoji" aria-hidden="true"></span>
                    <div>
                        <strong class="units-to-name"></strong>
                        <p class="units-to-description"></p>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template id="fun-facts-template">
        <div class="fun-facts">
            <h5>🎉 Fun Fact:</h5>
            <p class="fun-fact-text"></p>
        </div>
    </template>
    <template id="example-item-template">
        <div class="example-item">
            <div class="example-emoji" aria-hidden="true"></div>
            <div class="example-text"></div>
        </div>
    </template>

    <script src="../units-data.js"></script>
    <script src="../script.js"></script>
    <script src="translations.js"></script>
</body>
