<body>
    <div class="container">
        <div class="top-bar">
            <div class="language-selector">
                <select onchange="location.href=this.value" aria-label="Sprache auswählen">
                    <option value="../index.html">🇧🇷 Português</option>
                    <option value="../en/index.html">🇺🇸 English</option>
                    <option value="../es/index.html">🇪🇸 Español</option>
                    <option value="../fr/index.html">🇫🇷 Français</option>
                    <option value="index.html" selected>🇩🇪 Deutsch</option>
                </select>
            </div>
            <div class="theme-toggle">
                <span class="theme-label" id="theme-label">Thema</span>
                <div class="theme-options" role="group" aria-labelledby="theme-label">
                    <button type="button" class="theme-option" data-theme="system" aria-pressed="true">System</button>
                    <button type="button" class="theme-option" data-theme="light" aria-pressed="false">Hell</button>
                    <button type="button" class="theme-option" data-theme="dark" aria-pressed="false">Dunkel</button>
                </div>
            </div>
        </div>
        <main>
            <div class="converter-section">
                <!-- Dimension Selection -->
                <div class="dimension-selector">
                    <h3>Wähle den Messentyp</h3>
                    <div class="dimension-buttons">
                        <button class="dimension-btn active" data-dimension="length" aria-label="Länge auswählen">
                            📏 Länge
                        </button>
                        <button class="dimension-btn" data-dimension="weight" aria-label="Gewicht auswählen">
                            ⚖️ Gewicht
                        </button>
                        <button class="dimension-btn" data-dimension="height" aria-label="Höhe auswählen">
                            📏 Höhe
                        </button>
                    </div>
                    <select class="dimension-select" aria-label="Ausgewählter Messentyp">
                        <option value="length">Länge</option>
                        <option value="weight">Gewicht</option>
                        <option value="height">Höhe</option>
                    </select>
                </div>

                <!-- Umrechnungsbereich -->
                <div class="conversion-area">
                    <div class="conversion-row">
                        <div class="unit-group">
                            <label for="from-unit">Von:</label>
                            <select id="from-unit" aria-label="Ausgangseinheit"></select>
                        </div>
                        
                        <div class="input-group">
                            <label for="value-input">Wert:</label>
                            <input type="number" id="value-input" placeholder="Wert eingeben" step="any" oninput="trackInputEvent(this.value)" aria-label="Zu umrechnender Wert" inputmode="decimal">
                        </div>
                    </div>

                    <button class="conversion-arrow" id="swap-units-btn" title="Einheiten tauschen" aria-label="Einheiten der Umrechnung tauschen">
                        ⇅
                    </button>

                    <div class="conversion-row">
                        <div class="unit-group">
                            <label for="to-unit">Zu:</label>
                            <select id="to-unit" aria-label="Zieleinheit"></select>
                        </div>
                        
                        <div class="result-group">
                            <label for="result-display">Ergebnis:</label>
                            <input type="text" id="result-display" readonly placeholder="Ergebnis erscheint hier" aria-label="Umrechnungsergebnis">
                        </div>
                    </div>
                </div>

                <!-- Info-Bereich -->
                <div id="info-display" class="info-display" aria-live="polite">
                    <p>Wähle eine Dimension und Einheiten, um mit der Umrechnung zu beginnen!</p>
                </div>
            </div>

            <!-- Beispiele -->
            <section class="examples-section">
                <h2>💡 Lustige Beispiele zum Ausprobieren</h2>
                <div id="examples-list" class="examples-list">
                    <!-- Beispiele werden dynamisch eingefügt -->
                </div>
            </section>
        </main>

        <footer>
            <p>Mit ❤️ erstellt von <a href="https://github.com/mathiasfk" target="_blank" rel="noopener">mathiasfk</a>, um Maßeinheiten lustiger und lehrreicher zu machen!</p>
            <p><small>Version 2.1.0 • © 2026 Mathias FK • <a href="https://github.com/mathiasfk/unit-converter" target="_blank" rel="noopener">Quellcode offen auf GitHub</a></small></p>
        </footer>
    </div>

    <!-- Templates für dynamisches Rendering -->
    <template id="conversion-info-template">
        <div class="conversion-info">
            <p><strong class="conversion-from"></strong> entspricht <strong class="conversion-to"></strong></p>
            <div class="unit-details">
                <div class="unit-detail">
                    <span class="unit-emoji conversion-from-emoji" aria-hidden="true"></span>
                    <span class="unit-description conversion-from-description"></span>
                </div>
                <div class="unit-detail">
                    <span class="unit-emoji conversion-to-emoji" aria-hidden="true"></span>
                    <span class="unit-description conversion-to-description"></span>
                </div>
            </div>
            <div class="fun-facts-container"></div>
        </div>
    </template>
    <template id="units-info-template">
        <div class="units-info">
            <h4>Einheiteninformationen</h4>
            <div class="unit-info-grid">
                <div class="unit-info-item">
                    <span class="unit-emoji units-from-emoji" aria-hidden="true"></span>
                    <div>
                        <strong class="units-from-name"></strong>
                        <p class="units-from-description"></p>
                    </div>
                </div>
                <div class="conversion-divider" aria-hidden="true"></div>
                <div class="unit-info-item">
                    <span class="unit-emoji units-to-emoji" aria-hidden="true"></span>
                    <div>
                        <strong class="units-to-name"></strong>
                        <p class="units-to-description"></p>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template id="fun-facts-template">
        <div class="fun-facts">
            <h5>🎉 Fun Fact:</h5>
            <p class="fun-fact-text"></p>
        </div>
    </template>
    <template id="example-item-template">
        <div class="example-item">
            <div class="example-emoji" aria-hidden="true"></div>
            <div class="example-text"></div>
        </div>
    </template>

    <script src="../units-data.js"></script>
    <script src="../script.js"></script>
    <script src="translations.js"></script>
</body>
