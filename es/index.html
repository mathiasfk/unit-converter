<body>
    <div class="container">
        <div class="top-bar">
            <div class="language-selector">
                <select onchange="location.href=this.value" aria-label="Seleccionar idioma">
                    <option value="../index.html">🇧🇷 Português</option>
                    <option value="../en/index.html">🇺🇸 English</option>
                    <option value="index.html" selected>🇪🇸 Español</option>
                    <option value="../fr/index.html">🇫🇷 Français</option>
                    <option value="../de/index.html">🇩🇪 Deutsch</option>
                </select>
            </div>
            <div class="theme-toggle">
                <span class="theme-label" id="theme-label">Tema</span>
                <div class="theme-options" role="group" aria-labelledby="theme-label">
                    <button type="button" class="theme-option" data-theme="system" aria-pressed="true">Sistema</button>
                    <button type="button" class="theme-option" data-theme="light" aria-pressed="false">Claro</button>
                    <button type="button" class="theme-option" data-theme="dark" aria-pressed="false">Oscuro</button>
                </div>
            </div>
        </div>
        <main>
            <div class="converter-section">
                <!-- Selección de Dimensión -->
                <div class="dimension-selector">
                    <h3>Seleccione el tipo de medida</h3>
                    <div class="dimension-buttons">
                        <button class="dimension-btn active" data-dimension="length" aria-label="Seleccionar longitud">
                            📏 Longitud
                        </button>
                        <button class="dimension-btn" data-dimension="weight" aria-label="Seleccionar peso">
                            ⚖️ Peso
                        </button>
                        <button class="dimension-btn" data-dimension="height" aria-label="Seleccionar altura">
                            📏 Altura
                        </button>
                    </div>
                    <select class="dimension-select" aria-label="Tipo de medida seleccionado">
                        <option value="length">Longitud</option>
                        <option value="weight">Peso</option>
                        <option value="height">Altura</option>
                    </select>
                </div>

                <!-- Área de Conversión -->
                <div class="conversion-area">
                    <div class="conversion-row">
                        <div class="unit-group">
                            <label for="from-unit">De:</label>
                            <select id="from-unit" aria-label="Unidad de origen"></select>
                        </div>
                        
                        <div class="input-group">
                            <label for="value-input">Valor:</label>
                            <input type="number" id="value-input" placeholder="Ingrese un valor" step="any" oninput="trackInputEvent(this.value)" aria-label="Valor a convertir" inputmode="decimal">
                        </div>
                    </div>

                    <button class="conversion-arrow" id="swap-units-btn" title="Invertir unidades" aria-label="Invertir unidades de conversión">
                        ⇅
                    </button>

                    <div class="conversion-row">
                        <div class="unit-group">
                            <label for="to-unit">A:</label>
                            <select id="to-unit" aria-label="Unidad de destino"></select>
                        </div>
                        
                        <div class="result-group">
                            <label for="result-display">Resultado:</label>
                            <input type="text" id="result-display" readonly placeholder="El resultado aparecerá aquí" aria-label="Resultado de la conversión">
                        </div>
                    </div>
                </div>

                <!-- Área de Información -->
                <div id="info-display" class="info-display" aria-live="polite">
                    <p>¡Seleccione una dimensión y unidades para comenzar a convertir!</p>
                </div>
            </div>

            <!-- Ejemplos -->
            <section class="examples-section">
                <h2>💡 Ejemplos divertidos para probar</h2>
                <div id="examples-list" class="examples-list">
                    <!-- Los ejemplos se insertarán dinámicamente -->
                </div>
            </section>
        </main>

        <footer>
            <p>Creado con ❤️ por <a href="https://github.com/mathiasfk" target="_blank" rel="noopener">mathiasfk</a> para hacer las medidas más divertidas y educativas!</p>
            <p><small>Versión 2.1.0 • © 2026 Mathias FK • <a href="https://github.com/mathiasfk/unit-converter" target="_blank" rel="noopener">Código abierto en GitHub</a></small></p>
        </footer>
    </div>

    <!-- Templates para renderización dinámica -->
    <template id="conversion-info-template">
        <div class="conversion-info">
            <p><strong class="conversion-from"></strong> equivale a <strong class="conversion-to"></strong></p>
            <div class="unit-details">
                <div class="unit-detail">
                    <span class="unit-emoji conversion-from-emoji" aria-hidden="true"></span>
                    <span class="unit-description conversion-from-description"></span>
                </div>
                <div class="unit-detail">
                    <span class="unit-emoji conversion-to-emoji" aria-hidden="true"></span>
                    <span class="unit-description conversion-to-description"></span>
                </div>
            </div>
            <div class="fun-facts-container"></div>
        </div>
    </template>
    <template id="units-info-template">
        <div class="units-info">
            <h4>Información de las Unidades</h4>
            <div class="unit-info-grid">
                <div class="unit-info-item">
                    <span class="unit-emoji units-from-emoji" aria-hidden="true"></span>
                    <div>
                        <strong class="units-from-name"></strong>
                        <p class="units-from-description"></p>
                    </div>
                </div>
                <div class="conversion-divider" aria-hidden="true"></div>
                <div class="unit-info-item">
                    <span class="unit-emoji units-to-emoji" aria-hidden="true"></span>
                    <div>
                        <strong class="units-to-name"></strong>
                        <p class="units-to-description"></p>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template id="fun-facts-template">
        <div class="fun-facts">
            <h5>🎉 Dato Curioso:</h5>
            <p class="fun-fact-text"></p>
        </div>
    </template>
    <template id="example-item-template">
        <div class="example-item">
            <div class="example-emoji" aria-hidden="true"></div>
            <div class="example-text"></div>
        </div>
    </template>

    <script src="../units-data.js"></script>
    <script src="../script.js"></script>
    <script src="translations.js"></script>
</body>
</html>
