<body>
    <div class="container">
        <div class="top-bar">
            <div class="language-selector">
                <select onchange="location.href=this.value" aria-label="Choisir la langue">
                    <option value="../index.html">🇧🇷 Português</option>
                    <option value="../en/index.html">🇺🇸 English</option>
                    <option value="../es/index.html">🇪🇸 Español</option>
                    <option value="index.html" selected>🇫🇷 Français</option>
                    <option value="../de/index.html">🇩🇪 Deutsch</option>
                </select>
            </div>
            <div class="theme-toggle">
                <span class="theme-label" id="theme-label">Thème</span>
                <div class="theme-options" role="group" aria-labelledby="theme-label">
                    <button type="button" class="theme-option" data-theme="system" aria-pressed="true">Système</button>
                    <button type="button" class="theme-option" data-theme="light" aria-pressed="false">Clair</button>
                    <button type="button" class="theme-option" data-theme="dark" aria-pressed="false">Sombre</button>
                </div>
            </div>
        </div>
        <main>
            <div class="converter-section">
                <!-- Sélection de la Dimension -->
                <div class="dimension-selector">
                    <h3>Sélectionnez le type de mesure</h3>
                    <div class="dimension-buttons">
                        <button class="dimension-btn active" data-dimension="length" aria-label="Sélectionner la longueur">
                            📏 Longueur
                        </button>
                        <button class="dimension-btn" data-dimension="weight" aria-label="Sélectionner le poids">
                            ⚖️ Poids
                        </button>
                        <button class="dimension-btn" data-dimension="height" aria-label="Sélectionner la hauteur">
                            📏 Hauteur
                        </button>
                    </div>
                    <select class="dimension-select" aria-label="Type de mesure sélectionné">
                        <option value="length">Longueur</option>
                        <option value="weight">Poids</option>
                        <option value="height">Hauteur</option>
                    </select>
                </div>

                <!-- Zone de Conversion -->
                <div class="conversion-area">
                    <div class="conversion-row">
                        <div class="unit-group">
                            <label for="from-unit">De :</label>
                            <select id="from-unit" aria-label="Unité de source"></select>
                        </div>
                        
                        <div class="input-group">
                            <label for="value-input">Valeur :</label>
                            <input type="number" id="value-input" placeholder="Entrez une valeur" step="any" oninput="trackInputEvent(this.value)" aria-label="Valeur à convertir" inputmode="decimal">
                        </div>
                    </div>

                    <button class="conversion-arrow" id="swap-units-btn" title="Inverser les unités" aria-label="Inverser les unités de conversion">
                        ⇅
                    </button>

                    <div class="conversion-row">
                        <div class="unit-group">
                            <label for="to-unit">À :</label>
                            <select id="to-unit" aria-label="Unité de cible"></select>
                        </div>
                        
                        <div class="result-group">
                            <label for="result-display">Résultat :</label>
                            <input type="text" id="result-display" readonly placeholder="Le résultat apparaîtra ici" aria-label="Résultat de la conversion">
                        </div>
                    </div>
                </div>

                <!-- Zone d'Information -->
                <div id="info-display" class="info-display" aria-live="polite">
                    <p>Sélectionnez une dimension et des unités pour commencer la conversion !</p>
                </div>
            </div>

            <!-- Exemples -->
            <section class="examples-section">
                <h2>💡 Exemples amusants à essayer</h2>
                <div id="examples-list" class="examples-list">
                    <!-- Les exemples seront insérés dynamiquement -->
                </div>
            </section>
        </main>

        <footer>
            <p>Créé avec ❤️ par <a href="https://github.com/mathiasfk" target="_blank" rel="noopener">mathiasfk</a> pour rendre les mesures plus amusantes et éducatives !</p>
            <p><small>Version 2.1.0 • © 2026 Mathias FK • <a href="https://github.com/mathiasfk/unit-converter" target="_blank" rel="noopener">Code source ouvert sur GitHub</a></small></p>
        </footer>
    </div>

    <!-- Templates pour le rendu dynamique -->
    <template id="conversion-info-template">
        <div class="conversion-info">
            <p><strong class="conversion-from"></strong> équivaut à <strong class="conversion-to"></strong></p>
            <div class="unit-details">
                <div class="unit-detail">
                    <span class="unit-emoji conversion-from-emoji" aria-hidden="true"></span>
                    <span class="unit-description conversion-from-description"></span>
                </div>
                <div class="unit-detail">
                    <span class="unit-emoji conversion-to-emoji" aria-hidden="true"></span>
                    <span class="unit-description conversion-to-description"></span>
                </div>
            </div>
            <div class="fun-facts-container"></div>
        </div>
    </template>
    <template id="units-info-template">
        <div class="units-info">
            <h4>Informations sur les Unités</h4>
            <div class="unit-info-grid">
                <div class="unit-info-item">
                    <span class="unit-emoji units-from-emoji" aria-hidden="true"></span>
                    <div>
                        <strong class="units-from-name"></strong>
                        <p class="units-from-description"></p>
                    </div>
                </div>
                <div class="conversion-divider" aria-hidden="true"></div>
                <div class="unit-info-item">
                    <span class="unit-emoji units-to-emoji" aria-hidden="true"></span>
                    <div>
                        <strong class="units-to-name"></strong>
                        <p class="units-to-description"></p>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template id="fun-facts-template">
        <div class="fun-facts">
            <h5>🎉 Fait amusant :</h5>
            <p class="fun-fact-text"></p>
        </div>
    </template>
    <template id="example-item-template">
        <div class="example-item">
            <div class="example-emoji" aria-hidden="true"></span>
            <div class="example-text"></div>
        </div>
    </template>

    <script src="../units-data.js"></script>
    <script src="../script.js"></script>
    <script src="translations.js"></script>
</body>
</html>
