<body>
    <div class="container">
        <div class="top-bar">
            <div class="language-selector">
                <select onchange="location.href=this.value" aria-label="Selecionar idioma">
                    <option value="index.html" selected>🇧🇷 Português</option>
                    <option value="en/index.html">🇺🇸 English</option>
                    <option value="es/index.html">🇪🇸 Español</option>
                    <option value="fr/index.html">🇫🇷 Français</option>
                    <option value="de/index.html">🇩🇪 Deutsch</option>
                </select>
            </div>
            <div class="theme-toggle">
                <span class="theme-label" id="theme-label">Tema</span>
                <div class="theme-options" role="group" aria-labelledby="theme-label">
                    <button type="button" class="theme-option" data-theme="system" aria-pressed="true">Sistema</button>
                    <button type="button" class="theme-option" data-theme="light" aria-pressed="false">Claro</button>
                    <button type="button" class="theme-option" data-theme="dark" aria-pressed="false">Escuro</button>
                </div>
            </div>
        </div>
        <main>
            <div class="converter-section">
                <!-- Seleção de Dimensão -->
                <div class="dimension-selector">
                    <h3>Selecione o tipo de medida</h3>
                    <div class="dimension-buttons">
                        <button class="dimension-btn active" data-dimension="length" aria-label="Selecionar comprimento">
                            📏 Comprimento
                        </button>
                        <button class="dimension-btn" data-dimension="weight" aria-label="Selecionar peso">
                            ⚖️ Peso
                        </button>
                        <button class="dimension-btn" data-dimension="height" aria-label="Selecionar altura">
                            📏 Altura
                        </button>
                    </div>
                    <select class="dimension-select" aria-label="Tipo de medida selecionado">
                        <option value="length">Comprimento</option>
                        <option value="weight">Peso</option>
                        <option value="height">Altura</option>
                    </select>
                </div>

                <!-- Área de Conversão -->
                <div class="conversion-area">
                    <div class="conversion-row">
                        <div class="unit-group">
                            <label for="from-unit">De:</label>
                            <select id="from-unit" aria-label="Unidade de origem"></select>
                        </div>
                        
                        <div class="input-group">
                            <label for="value-input">Valor:</label>
                            <input type="number" id="value-input" placeholder="Digite um valor" step="any" oninput="trackInputEvent(this.value)" aria-label="Valor a ser convertido" inputmode="decimal">
                        </div>
                    </div>

                    <button class="conversion-arrow" id="swap-units-btn" title="Inverter unidades" aria-label="Inverter unidades de conversão">
                        ⇅
                    </button>

                    <div class="conversion-row">
                        <div class="unit-group">
                            <label for="to-unit">Para:</label>
                            <select id="to-unit" aria-label="Unidade de destino"></select>
                        </div>
                        
                        <div class="result-group">
                            <label for="result-display">Resultado:</label>
                            <input type="text" id="result-display" readonly placeholder="Resultado aparecerá aqui" aria-label="Resultado da conversão">
                        </div>
                    </div>
                </div>

                <!-- Área de Informações -->
                <div id="info-display" class="info-display" aria-live="polite">
                    <p>Selecione uma dimensão e unidades para começar a converter!</p>
                </div>
            </div>

            <!-- Exemplos -->
            <section class="examples-section">
                <h2>💡 Exemplos divertidos para experimentar</h2>
                <div id="examples-list" class="examples-list">
                    <!-- Exemplos serão inseridos dinamicamente -->
                </div>
            </section>
        </main>

        <footer>
            <p>Criado com ❤️ por <a href="https://github.com/mathiasfk" target="_blank" rel="noopener">mathiasfk</a> para tornar as medidas mais divertidas e educativas!</p>
            <p><small>Versão 2.1.0 • © 2026 Mathias FK • <a href="https://github.com/mathiasfk/unit-converter" target="_blank" rel="noopener">Código aberto no GitHub</a></small></p>
        </footer>
    </div>

    <!-- Templates para renderização dinâmica -->
    <template id="conversion-info-template">
        <div class="conversion-info">
            <p><strong class="conversion-from"></strong> equivale a <strong class="conversion-to"></strong></p>
            <div class="unit-details">
                <div class="unit-detail">
                    <span class="unit-emoji conversion-from-emoji" aria-hidden="true"></span>
                    <span class="unit-description conversion-from-description"></span>
                </div>
                <div class="unit-detail">
                    <span class="unit-emoji conversion-to-emoji" aria-hidden="true"></span>
                    <span class="unit-description conversion-to-description"></span>
                </div>
            </div>
            <div class="fun-facts-container"></div>
        </div>
    </template>
    <template id="units-info-template">
        <div class="units-info">
            <h4>Informações das Unidades</h4>
            <div class="unit-info-grid">
                <div class="unit-info-item">
                    <span class="unit-emoji units-from-emoji" aria-hidden="true"></span>
                    <div>
                        <strong class="units-from-name"></strong>
                        <p class="units-from-description"></p>
                    </div>
                </div>
                <div class="conversion-divider" aria-hidden="true"></div>
                <div class="unit-info-item">
                    <span class="unit-emoji units-to-emoji" aria-hidden="true"></span>
                    <div>
                        <strong class="units-to-name"></strong>
                        <p class="units-to-description"></p>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template id="fun-facts-template">
        <div class="fun-facts">
            <h5>🎉 Fato Curioso:</h5>
            <p class="fun-fact-text"></p>
        </div>
    </template>
    <template id="example-item-template">
        <div class="example-item">
            <div class="example-emoji" aria-hidden="true"></div>
            <div class="example-text"></div>
        </div>
    </template>

    <script src="units-data.js"></script>
    <script src="script.js"></script>
    <script src="pt/translations.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var select = document.querySelector('.dimension-select');
        var buttons = document.querySelectorAll('.dimension-btn');
        if (select) {
            select.addEventListener('change', function() {
                buttons.forEach(function(btn) {
                    if (btn.dataset.dimension === select.value) {
                        btn.click();
                    }
                });
            });
        }
    });
    </script>
</body>
